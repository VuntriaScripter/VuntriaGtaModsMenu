    <style>
        * {
            margin: 0;

            box-sizing: border-box;

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #071a33 0%, #02060d 45%, #000000 100%);
            font-family: Arial, sans-serif;
            color: white;

        /* =========================

        ========================= */

        .discord-info {
            position: fixed;
            top: 25px;
            left: 25px;

            width: 230px;

            padding: 16px;

            background: rgba(3, 12, 25, 0.92);

            border: 1px solid #0b5cff;
            border-radius: 12px;

            box-shadow:

            z-index: 100;
        }

        .discord-header {
            font-size: 12px;
            font-weight: bold;
            color: #4da3ff;

            text-transform: uppercase;
            letter-spacing: 1.5px;

            margin-bottom: 12px;
        }

        .discord-item {
            display: flex;
            align-items: center;

            gap: 12px;

            padding: 10px;

            background: rgba(7, 26, 51, 0.7);

            border-radius: 8px;

            margin-bottom: 8px;
        }

        .discord-item:last-child {
            margin-bottom: 0;
        }

        .discord-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #061a35;

            border: 1px solid #0b5cff;

            border-radius: 8px;

            font-size: 18px;
        }

        .discord-text {
            display: flex;
            flex-direction: column;

            gap: 3px;
        }

        .discord-text strong {
            font-size: 14px;
            color: #ffffff;
        }

        .discord-text span {
            font-size: 11px;
            color: #71849b;
        }

        .online {
            color: #4da3ff !important;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            text-align: center;
            width: 90%;
            max-width: 650px;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 45px;

            color: #ffffff;

            text-shadow:
                0 0 10px #006eff,
                0 0 30px rgba(0, 110, 255, 0.5);
        }


        /* =========================
           MODS
        ========================= */

        .mods {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .mod-button {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px 25px;

            text-decoration: none;
            color: white;

            background: linear-gradient(
                135deg,
                #071a33,
                #030b16
            );

            border: 1px solid #0b5cff;
            border-radius: 12px;

            font-size: 17px;
            font-weight: 700;

            box-shadow:
                0 0 15px rgba(0, 92, 255, 0.12);

            transition: 0.25s ease;
        }

        .mod-button:hover {
            transform: translateY(-4px) scale(1.02);

            border-color: #1683ff;

            background: linear-gradient(
                135deg,
                #0b2c55,
                #061426
            );

            box-shadow:
                0 0 15px rgba(0, 110, 255, 0.45),
                0 0 35px rgba(0, 110, 255, 0.18);
        }


        /* =========================
           MOD NAME
        ========================= */

        .mod-name {
            display: flex;
            align-items: center;
            gap: 14px;
        }


        /* =========================
           ICON
        ========================= */

        .icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #061a35;

            border: 1px solid #0b5cff;

            border-radius: 9px;

            font-size: 20px;

            box-shadow:
                0 0 12px rgba(0, 110, 255, 0.2);
        }


        /* =========================
           DOWNLOAD
        ========================= */

        .download {
            color: #4da3ff;
            font-size: 15px;
        }


        /* =========================
           WINRAR
        ========================= */

        .winrar {
            margin-top: 30px;

            color: #6f8095;

            font-size: 13px;
        }


        /* =========================
           CREDIT
        ========================= */

        .credit {
            position: fixed;

            bottom: 18px;
            left: 50%;

            transform: translateX(-50%);

            color: #52657b;

            font-size: 12px;

            white-space: nowrap;
        }

        .credit strong {
            color: #4da3ff;

            text-shadow:
                0 0 10px rgba(0, 110, 255, 0.4);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .discord-info {
                top: 15px;
                left: 15px;

                width: 210px;
            }

            .container {
                padding-top: 150px;
                padding-bottom: 60px;
            }

            h1 {
                font-size: 36px;
                margin-bottom: 35px;
            }

            .mod-button {
                padding: 17px;
            }

            .mod-name {
                gap: 10px;
            }

            .download {
                font-size: 12px;
            }

            .credit {
                font-size: 10px;
            }
        }
    </style>
</head>
